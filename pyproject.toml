[project]
name = "decision-record"
version = "0.1.0"
description = "A Claude skill that turns a thread, notes or a transcript into a decision record and ages open decisions."
requires-python = ">=3.9"
# Standard library only, on purpose: the scripts run inside sandboxes that cannot install packages.
dependencies = []

[tool.ruff]
line-length = 160
target-version = "py39"

[tool.ruff.lint]
# E, F: errors and unused names. I: import order. B: likely bugs. UP: syntax older than Python 3.9.
# SIM: needless complexity. S: security (bandit).
select = ["E", "F", "I", "B", "UP", "SIM", "S"]

[tool.ruff.lint.per-file-ignores]
# Tests use assert-style helpers and temporary files by design.
"evals/**" = ["S101", "S108"]
