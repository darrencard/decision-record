[project]
name = "decision-record"
version = "0.3.2"
description = "A Claude skill that turns a thread, notes or a transcript into a decision record, ages open decisions, and writes the decisions key of the Landing Loop record."
license = "MIT"
requires-python = ">=3.11"
# Standard library only, on purpose: the scripts run inside sandboxes that cannot install packages.
dependencies = []

[tool.ruff]
line-length = 180
target-version = "py311"
# Copied unchanged from the Leader Report at a pinned commit (VENDORED.json); linted there, never edited here.
# svgkit is copied byte for byte from landing-loop at a pinned commit (VENDORED.json); linted there, never edited here.
extend-exclude = ["skills/decision-record/scripts/landing_brief.py", "skills/decision-record/scripts/vendor"]

[tool.ruff.lint]
# E, F: errors and unused names. I: import order. B: likely bugs. UP: syntax older than Python 3.11.
# SIM: needless complexity. S: security (bandit).
select = ["E", "F", "I", "B", "UP", "SIM", "S"]

[tool.ruff.lint.per-file-ignores]
# Tests use assert-style helpers, temporary files and subprocess on fixed arguments by design.
"evals/**" = ["S101", "S108", "S603"]
# The page's CSS and plain-words tables read best one rule or entry per line.
"skills/decision-record/scripts/render_html.py" = ["E501"]
